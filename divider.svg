<svg width="900" height="28" viewBox="0 0 900 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="14" x2="900" y2="14" stroke="#1F1F1F" stroke-width="1"/>
  <rect x="-240" y="13" width="240" height="2" fill="url(#pulseLine)">
    <animate attributeName="x" values="-240;900" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="14" r="2.5" fill="#525252">
    <animate attributeName="fill" values="#525252;#FFFFFF;#525252" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
