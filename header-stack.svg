<svg width="900" height="48" viewBox="0 0 900 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmerStack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipStack">
      <rect width="900" height="48" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipStack)">
    <rect width="900" height="48" fill="#000000"/>
    <rect x="-240" y="0" width="240" height="1.5" fill="url(#shimmerStack)">
      <animate attributeName="x" values="-240;900" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="16" width="3" height="16" rx="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="36" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
      TECH STACK
    </text>
    <text x="876" y="28" text-anchor="end" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">
      LANGUAGES · FRAMEWORKS · INFRA · AI
    </text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="47" rx="9.5" stroke="#1F1F1F"/>
</svg>
