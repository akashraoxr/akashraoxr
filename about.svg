<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="aboutClip">
      <rect width="900" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#aboutClip)">
    <!-- Pure Black Base -->
    <rect width="900" height="220" fill="#000000"/>

    <!-- Top Header Strip -->
    <rect width="900" height="42" fill="#060606"/>
    <line x1="0" y1="42" x2="900" y2="42" stroke="#1A1A1A" stroke-width="1"/>

    <!-- Animated Shimmer Along Header Divider -->
    <rect x="-260" y="41.5" width="260" height="1" fill="url(#aboutShimmer)">
      <animate attributeName="x" values="-260;900" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Terminal / Section Label -->
    <rect x="20" y="13" width="3" height="16" rx="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="36" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
      ABOUT ME
    </text>
    <text x="872" y="25" text-anchor="end" fill="#525252" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">
      SYS.PROFILE
    </text>

    <!-- Rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <!-- Row 1 -->
      <text x="36" y="78" fill="#525252" letter-spacing="1.2">NAME</text>
      <text x="150" y="78" fill="#FFFFFF" font-weight="600">Akash Rao</text>
      <text x="242" y="78" fill="#737373">@akashraoxr</text>

      <!-- Row 2 -->
      <text x="36" y="108" fill="#525252" letter-spacing="1.2">ROLE</text>
      <text x="150" y="108" fill="#E5E5E5">Full-Stack &amp; Systems Engineer</text>

      <!-- Row 3 -->
      <text x="36" y="138" fill="#525252" letter-spacing="1.2">FOCUS</text>
      <text x="150" y="138" fill="#A3A3A3">Web Architecture · Distributed Systems · Cloud · AI</text>

      <!-- Row 4 -->
      <text x="36" y="168" fill="#525252" letter-spacing="1.2">ETHOS</text>
      <text x="150" y="168" fill="#A3A3A3">Minimalist design, high-performance code, zero bloat</text>

      <!-- Row 5 -->
      <text x="36" y="198" fill="#525252" letter-spacing="1.2">WEB</text>
      <text x="150" y="198" fill="#FFFFFF">https://arxr.space/</text>
    </g>

    <!-- Animated Minimal Signal Bars on Right -->
    <g transform="translate(816, 154)">
      <rect x="0" y="18" width="4" height="16" rx="2" fill="#333333">
        <animate attributeName="height" values="10;28;10" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="24;6;24" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="10" width="4" height="24" rx="2" fill="#737373">
        <animate attributeName="height" values="24;10;24" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;24;10" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="6" width="4" height="28" rx="2" fill="#FFFFFF">
        <animate attributeName="height" values="14;32;14" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;2;20" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="14" width="4" height="20" rx="2" fill="#525252">
        <animate attributeName="height" values="22;8;22" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;26;12" dur="2.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="899" height="219" rx="13.5" stroke="#1F1F1F"/>
</svg>
