<svg width="900" height="64" viewBox="0 0 900 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect width="900" height="64" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="900" height="64" fill="#000000"/>
    <rect x="-260" y="0" width="260" height="1.5" fill="url(#footerShimmer)">
      <animate attributeName="x" values="-260;900" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="36" text-anchor="middle" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="3">
      AKASH RAO  ·  ARXR.SPACE  ·  @AKASHRAOXR
    </text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="63" rx="11.5" stroke="#1F1F1F"/>
</svg>
