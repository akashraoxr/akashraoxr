<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="900" height="240" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Pure Black Base -->
    <rect width="900" height="240" fill="#000000"/>

    <!-- Subtle Minimal Grid -->
    <g stroke="url(#gridFade)" stroke-width="1">
      <line x1="150" y1="0" x2="150" y2="240"/>
      <line x1="300" y1="0" x2="300" y2="240"/>
      <line x1="450" y1="0" x2="450" y2="240"/>
      <line x1="600" y1="0" x2="600" y2="240"/>
      <line x1="750" y1="0" x2="750" y2="240"/>
      <line x1="0" y1="60" x2="900" y2="60"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="180" x2="900" y2="180"/>
    </g>

    <!-- Animated Top Border Shimmer -->
    <rect x="-300" y="0" width="300" height="1.5" fill="url(#scanGrad)">
      <animate attributeName="x" values="-300;900" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated Bottom Border Shimmer -->
    <rect x="900" y="238.5" width="300" height="1.5" fill="url(#scanGrad)">
      <animate attributeName="x" values="900;-300" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner Brackets -->
    <path d="M24 38V24H38" stroke="#525252" stroke-width="1.5" stroke-linecap="square"/>
    <path d="M876 38V24H862" stroke="#525252" stroke-width="1.5" stroke-linecap="square"/>
    <path d="M24 202V216H38" stroke="#525252" stroke-width="1.5" stroke-linecap="square"/>
    <path d="M876 202V216H862" stroke="#525252" stroke-width="1.5" stroke-linecap="square"/>

    <!-- Live Status Pill -->
    <rect x="52" y="46" width="136" height="24" rx="12" fill="#0A0A0A" stroke="#262626"/>
    <circle cx="68" cy="58" r="3.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="58" r="6" fill="#22C55E" opacity="0.25">
      <animate attributeName="r" values="3.5;9;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="62" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.5">
      ONLINE // DEV
    </text>

    <!-- Main Name -->
    <text x="52" y="128" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="5">
      AKASH RAO
    </text>

    <!-- Blinking Terminal Cursor -->
    <rect x="382" y="96" width="3.5" height="36" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Subtitle -->
    <text x="54" y="162" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1.8">
      FULL-STACK ENGINEER  ·  SYSTEMS  ·  AI  ·  ARXR.SPACE
    </text>

    <!-- Bottom Handle -->
    <text x="54" y="196" fill="#404040" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.2">
      github.com/akashraoxr
    </text>

    <!-- Animated Minimal Geometric Orbit on Right -->
    <g transform="translate(760, 120)">
      <circle cx="0" cy="0" r="56" stroke="#1F1F1F" stroke-width="1" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="38" stroke="#333333" stroke-width="1" stroke-dasharray="18 10">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="20" stroke="#525252" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF">
        <animate attributeName="r" values="3.5;5;3.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="56" cy="0" r="2.5" fill="#FFFFFF">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-38" r="2" fill="#737373">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="13.5" stroke="#1F1F1F"/>
</svg>
